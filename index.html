<title>Color Configurator</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root {
    --bg: #efece7;
    --panel: rgba(255,255,255,0.92);
    --ink: #1c1c1c;
    --ink-soft: #6b6b6b;
    --line: #e2e0dc;
    --accent: #1c1c1c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  model-viewer {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: var(--bg);
    --poster-color: transparent;
  }
  .panel {
    position: fixed;
    left: 16px;
    bottom: 16px;
    z-index: 10;
    width: min(320px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    background: var(--panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.14);
    padding: 16px 18px;
  }
  .control {
    padding: 12px 0;
    border-top: 1px solid var(--line);
  }
  .control:first-of-type { border-top: none; padding-top: 0; }
  .control-title {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 40px;
    height: 30px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 2px;
    background: var(--panel);
    cursor: pointer;
    flex-shrink: 0;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }
  .swatch-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .lever-btn {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
  }
  .lever-btn.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--accent);
  }
  .tile-btn {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
    background-size: cover;
    background-position: center;
  }
  .tile-btn.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--accent);
  }
  .switch {
    position: relative;
    width: 40px;
    height: 22px;
    flex-shrink: 0;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .switch-track {
    position: absolute;
    inset: 0;
    background: #c9c6c0;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .switch-track::before {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.15s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .switch input:checked + .switch-track {
    background: var(--accent);
  }
  .switch input:checked + .switch-track::before {
    transform: translateX(18px);
  }
  .switch-label {
    font-size: 0.8rem;
    color: var(--ink);
  }
</style>

<model-viewer
  id="viewer"
  src="scene.glb"
  camera-controls
  touch-action="pan-y"
  interaction-prompt="none"
  environment-image="neutral"
  shadow-intensity="0.9"
  exposure="1.05"
  camera-orbit="-24.24deg 63.54deg 1.846m"
  camera-target="-0.183m -0.187m -0.092m"
  field-of-view="19.65deg"
  min-camera-orbit="auto auto 0.6m"
  max-camera-orbit="auto auto 4m">
</model-viewer>

<div class="panel">
  <div class="control">
    <span class="control-title">Lever Color</span>
    <div class="swatch-grid" id="leverRow"></div>
  </div>

  <div class="control">
    <span class="control-title">Shell Color</span>
    <div class="row">
      <input type="color" id="powderPicker" value="#046ffc">
      <label class="switch">
        <input type="checkbox" id="matteToggle">
        <span class="switch-track"></span>
      </label>
      <span class="switch-label">Matte?</span>
    </div>
  </div>

  <div class="control">
    <span class="control-title">Tile Color Select</span>
    <div class="swatch-grid" id="tileRow"></div>
  </div>
</div>

<script>
  // ---- color space helpers ----
  function srgbToLinearChannel(c) {
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  }
  function hexToLinear(hex) {
    const r = parseInt(hex.slice(1, 3), 16) / 255;
    const g = parseInt(hex.slice(3, 5), 16) / 255;
    const b = parseInt(hex.slice(5, 7), 16) / 255;
    return [srgbToLinearChannel(r), srgbToLinearChannel(g), srgbToLinearChannel(b)];
  }
  function rgbToHsv(r, g, b) {
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const d = max - min;
    let h = 0;
    if (d !== 0) {
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h /= 6;
      if (h < 0) h += 1;
    }
    const s = max === 0 ? 0 : d / max;
    return [h, s, max];
  }
  function hsvToRgb(h, s, v) {
    const i = Math.floor(h * 6);
    const f = h * 6 - i;
    const p = v * (1 - s);
    const q = v * (1 - f * s);
    const t = v * (1 - (1 - f) * s);
    switch (i % 6) {
      case 0: return [v, t, p];
      case 1: return [q, v, p];
      case 2: return [p, v, t];
      case 3: return [p, q, v];
      case 4: return [t, p, v];
      case 5: return [v, p, q];
    }
  }
  // Replicates the Blender "Hue/Saturation/Value" node used inside the
  // Shell Color material: hue offset, saturation scale, value scale,
  // then blended back by a factor (matches the .blend file).
  const POWDER_HSV = { hue: 0.5, saturation: 0.3999999165534973, value: 0.2999999225139618, factor: 1 };
  function applyPowderCoating(linearRgb) {
    let [h, s, v] = rgbToHsv(linearRgb[0], linearRgb[1], linearRgb[2]);
    h = (h + (POWDER_HSV.hue - 0.5) + 1) % 1;
    s = Math.max(0, Math.min(1, s * POWDER_HSV.saturation));
    v = Math.max(0, v * POWDER_HSV.value);
    const adjusted = hsvToRgb(h, s, v);
    const fac = POWDER_HSV.factor;
    return linearRgb.map((c, i) => c + fac * (adjusted[i] - c));
  }

  // ---- presets extracted directly from color_play.blend ----
  const FILAMENT_PALETTE = [
    {"i":0,"hex":"#e1dfdd"},{"i":1,"hex":"#212122"},
    {"i":2,"hex":"#959597"},{"i":3,"hex":"#c4c4c5"},
    {"i":4,"hex":"#a02727"},{"i":5,"hex":"#c46919"},
    {"i":6,"hex":"#c4ad27"},{"i":7,"hex":"#308938"},
    {"i":8,"hex":"#5d653c"},{"i":9,"hex":"#2755b3"},
    {"i":10,"hex":"#5095c4"},{"i":11,"hex":"#6f30a0"},
    {"i":12,"hex":"#c46c90"},{"i":13,"hex":"#b32781"},
    {"i":14,"hex":"#76553c"},{"i":15,"hex":"#b3953f"},
    {"i":16,"hex":"#c4b6a0"},{"i":17,"hex":"#c4a08b"},
    {"i":18,"hex":"#c4cea0"},{"i":19,"hex":"#907355"},
    {"i":20,"hex":"#e5e6e7"},{"i":21,"hex":"#dad4c4"},
    {"i":22,"hex":"#cea681"},{"i":23,"hex":"#c4816c"},
    {"i":24,"hex":"#7c273f"},{"i":25,"hex":"#a05938"},
    {"i":26,"hex":"#89bca0"},{"i":27,"hex":"#277c7c"},
    {"i":28,"hex":"#309590"},{"i":29,"hex":"#27a0aa"},
    {"i":30,"hex":"#273f95"},{"i":31,"hex":"#a090b8"},
    {"i":32,"hex":"#ad99b3"},{"i":33,"hex":"#c43f81"},
    {"i":34,"hex":"#aa1990"},{"i":35,"hex":"#593f2c"},
    {"i":36,"hex":"#aa9e81"},{"i":37,"hex":"#aa7c59"},
    {"i":38,"hex":"#957945"},{"i":39,"hex":"#a0bcc4"}
  ];
  const TILE_COUNT = 8;

  const viewer = document.getElementById("viewer");
  const tileTextureCache = {};

  function findMaterials(name) {
    return viewer.model ? viewer.model.materials.filter(m => m.name === name) : [];
  }
  function setMaterialColorLinear(materialName, linearRgb) {
    findMaterials(materialName).forEach(m => {
      m.pbrMetallicRoughness.setBaseColorFactor([linearRgb[0], linearRgb[1], linearRgb[2], 1]);
    });
  }
  function setRoughness(materialName, roughness) {
    findMaterials(materialName).forEach(m => m.pbrMetallicRoughness.setRoughnessFactor(roughness));
  }
  function setMetallic(materialName, metallic) {
    findMaterials(materialName).forEach(m => m.pbrMetallicRoughness.setMetallicFactor(metallic));
  }

  function updateFilament(index) {
    const p = FILAMENT_PALETTE[index];
    setMaterialColorLinear("Printed plastic", hexToLinear(p.hex));
    document.querySelectorAll(".lever-btn").forEach((btn, i) => btn.classList.toggle("selected", i === index));
  }

  async function updateTile(index) {
    if (!tileTextureCache[index]) {
      tileTextureCache[index] = await viewer.createTexture("tile_" + index + ".png");
    }
    const tex = tileTextureCache[index];
    findMaterials("Square Wall Tiles").forEach(m => {
      // use the real baked Blender texture for this preset rather than a tint,
      // so the physical tile pattern renders exactly as it does in Blender
      m.pbrMetallicRoughness.baseColorTexture.setTexture(tex);
      m.pbrMetallicRoughness.setBaseColorFactor([1, 1, 1, 1]);
    });
    document.querySelectorAll(".tile-btn").forEach((btn, i) => btn.classList.toggle("selected", i === index));
  }

  function updatePowder(hex) {
    const linear = hexToLinear(hex);
    const coated = applyPowderCoating(linear);
    setMaterialColorLinear("Black Powder Coating Texture", coated);
  }
  function updateMatte(isMatte) {
    setMetallic("Black Powder Coating Texture", isMatte ? 0.0 : 1.0);
  }

  // build lever (filament) swatch buttons
  const leverRow = document.getElementById("leverRow");
  FILAMENT_PALETTE.forEach((p, i) => {
    const btn = document.createElement("button");
    btn.className = "lever-btn";
    btn.style.background = p.hex;
    btn.addEventListener("click", () => updateFilament(i));
    leverRow.appendChild(btn);
  });

  // build tile swatch buttons (thumbnails of the actual baked textures)
  const tileRow = document.getElementById("tileRow");
  for (let i = 0; i < TILE_COUNT; i++) {
    const btn = document.createElement("button");
    btn.className = "tile-btn";
    btn.style.backgroundImage = "url('tile_" + i + ".png')";
    btn.addEventListener("click", () => updateTile(i));
    tileRow.appendChild(btn);
  }

  document.getElementById("powderPicker").addEventListener("input", e => updatePowder(e.target.value));
  document.getElementById("matteToggle").addEventListener("change", e => updateMatte(e.target.checked));

  viewer.addEventListener("load", () => {
    setRoughness("Printed plastic", 0.4);
    setMetallic("Printed plastic", 0.0);
    setRoughness("Black Powder Coating Texture", 0.45);
    updateFilament(21);
    updateTile(1);
    updatePowder("#046ffc");
    updateMatte(document.getElementById("matteToggle").checked);
  });
</script>
