<title>Color Configurator</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root {
    --bg: #efece7;
    --panel: rgba(255,255,255,0.92);
    --ink: #1c1c1c;
    --ink-soft: #6b6b6b;
    --line: #e2e0dc;
    --accent: #1c1c1c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  model-viewer {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: var(--bg);
    --poster-color: transparent;
  }
  .panel {
    position: fixed;
    left: 16px;
    bottom: 16px;
    z-index: 10;
    width: min(320px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    background: var(--panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.14);
    padding: 16px 18px 8px;
  }
  .panel-title {
    font-size: 0.95rem;
    font-weight: 700;
    margin: 0 0 2px;
  }
  .panel-sub {
    font-size: 0.76rem;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }
  .control {
    padding: 12px 0;
    border-top: 1px solid var(--line);
  }
  .control:first-of-type { border-top: none; }
  .control-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 8px;
  }
  .control-title {
    font-size: 0.85rem;
    font-weight: 600;
  }
  .control-value {
    font-size: 0.78rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .swatch {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 1px solid rgba(0,0,0,0.15);
    display: inline-block;
    flex-shrink: 0;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    display: block;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 40px;
    height: 30px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 2px;
    background: var(--panel);
    cursor: pointer;
    flex-shrink: 0;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }
  .tile-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tile-btn {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
  }
  .tile-btn.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--accent);
  }
  .hint {
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-top: 6px;
    line-height: 1.3;
  }
  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .switch-label {
    font-size: 0.78rem;
    color: var(--ink-soft);
  }
  .switch {
    position: relative;
    width: 40px;
    height: 22px;
    flex-shrink: 0;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .switch-track {
    position: absolute;
    inset: 0;
    background: #c9c6c0;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .switch-track::before {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.15s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .switch input:checked + .switch-track {
    background: var(--accent);
  }
  .switch input:checked + .switch-track::before {
    transform: translateX(18px);
  }
</style>

<model-viewer
  id="viewer"
  src="scene.glb"
  camera-controls
  touch-action="pan-y"
  interaction-prompt="none"
  environment-image="neutral"
  shadow-intensity="0.9"
  exposure="1.05"
  camera-orbit="-24.24deg 63.54deg 1.846m"
  camera-target="-0.183m -0.187m -0.092m"
  field-of-view="19.65deg"
  min-camera-orbit="auto auto 0.6m"
  max-camera-orbit="auto auto 4m">
</model-viewer>

<div class="panel">
  <p class="panel-title">Color Configurator</p>
  <p class="panel-sub">Drag to orbit, scroll to zoom</p>

  <div class="control">
    <div class="control-head">
      <span class="control-title">Filament Color</span>
      <span class="control-value"><span class="swatch" id="filamentSwatch"></span><span id="filamentLabel"></span></span>
    </div>
    <input type="range" id="filamentSlider" min="0" max="39" step="1" value="21">
  </div>

  <div class="control">
    <div class="control-head">
      <span class="control-title">Black Powder Coating</span>
      <span class="control-value"><span class="swatch" id="powderSwatch"></span><span id="powderLabel"></span></span>
    </div>
    <div class="row">
      <input type="color" id="powderPicker" value="#046ffc">
      <div class="switch-row" style="flex:1;">
        <span class="switch-label">Metallic</span>
        <label class="switch">
          <input type="checkbox" id="metallicToggle" checked>
          <span class="switch-track"></span>
        </label>
      </div>
    </div>
    <div class="hint">The coating darkens and mutes whatever color you pick, the same way the real finish does</div>
  </div>

  <div class="control">
    <div class="control-head">
      <span class="control-title">Tile Color Select</span>
      <span class="control-value"><span class="swatch" id="tileSwatch"></span><span id="tileLabel"></span></span>
    </div>
    <div class="tile-row" id="tileRow"></div>
  </div>
</div>

<script>
  // ---- color space helpers ----
  function srgbToLinearChannel(c) {
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  }
  function hexToLinear(hex) {
    const r = parseInt(hex.slice(1, 3), 16) / 255;
    const g = parseInt(hex.slice(3, 5), 16) / 255;
    const b = parseInt(hex.slice(5, 7), 16) / 255;
    return [srgbToLinearChannel(r), srgbToLinearChannel(g), srgbToLinearChannel(b)];
  }
  function linearToSrgbChannel(c) {
    c = Math.max(0, Math.min(1, c));
    return c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
  }
  function linearToHex(rgb) {
    return "#" + rgb.slice(0, 3).map(v => {
      const s = Math.round(linearToSrgbChannel(v) * 255);
      return s.toString(16).padStart(2, "0");
    }).join("");
  }
  function rgbToHsv(r, g, b) {
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const d = max - min;
    let h = 0;
    if (d !== 0) {
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h /= 6;
      if (h < 0) h += 1;
    }
    const s = max === 0 ? 0 : d / max;
    return [h, s, max];
  }
  function hsvToRgb(h, s, v) {
    const i = Math.floor(h * 6);
    const f = h * 6 - i;
    const p = v * (1 - s);
    const q = v * (1 - f * s);
    const t = v * (1 - (1 - f) * s);
    switch (i % 6) {
      case 0: return [v, t, p];
      case 1: return [q, v, p];
      case 2: return [p, v, t];
      case 3: return [p, q, v];
      case 4: return [t, p, v];
      case 5: return [v, p, q];
    }
  }
  // Replicates the Blender "Hue/Saturation/Value" node used inside the
  // Black Powder Coating Texture material: hue offset, saturation scale,
  // value scale, then blended back by a factor (matches the .blend file).
  const POWDER_HSV = { hue: 0.5, saturation: 0.3999999165534973, value: 0.2999999225139618, factor: 1 };
  function applyPowderCoating(linearRgb) {
    let [h, s, v] = rgbToHsv(linearRgb[0], linearRgb[1], linearRgb[2]);
    h = (h + (POWDER_HSV.hue - 0.5) + 1) % 1;
    s = Math.max(0, Math.min(1, s * POWDER_HSV.saturation));
    v = Math.max(0, v * POWDER_HSV.value);
    const adjusted = hsvToRgb(h, s, v);
    const fac = POWDER_HSV.factor;
    return linearRgb.map((c, i) => c + fac * (adjusted[i] - c));
  }

  // ---- presets extracted directly from color_play.blend ----
  const FILAMENT_PALETTE = [
    {"i":0,"hex":"#e1dfdd","name":"Light Gray"},{"i":1,"hex":"#212122","name":"Black"},
    {"i":2,"hex":"#959597","name":"Gray"},{"i":3,"hex":"#c4c4c5","name":"Light Gray"},
    {"i":4,"hex":"#a02727","name":"Dark Red"},{"i":5,"hex":"#c46919","name":"Deep Red"},
    {"i":6,"hex":"#c4ad27","name":"Deep Yellow"},{"i":7,"hex":"#308938","name":"Dark Green"},
    {"i":8,"hex":"#5d653c","name":"Dark Green"},{"i":9,"hex":"#2755b3","name":"Deep Blue"},
    {"i":10,"hex":"#5095c4","name":"Deep Blue"},{"i":11,"hex":"#6f30a0","name":"Dark Purple"},
    {"i":12,"hex":"#c46c90","name":"Deep Red"},{"i":13,"hex":"#b32781","name":"Deep Red"},
    {"i":14,"hex":"#76553c","name":"Dark Orange"},{"i":15,"hex":"#b3953f","name":"Deep Orange"},
    {"i":16,"hex":"#c4b6a0","name":"Orange"},{"i":17,"hex":"#c4a08b","name":"Orange"},
    {"i":18,"hex":"#c4cea0","name":"Green"},{"i":19,"hex":"#907355","name":"Dark Orange"},
    {"i":20,"hex":"#e5e6e7","name":"Light Gray"},{"i":21,"hex":"#dad4c4","name":"Orange"},
    {"i":22,"hex":"#cea681","name":"Orange"},{"i":23,"hex":"#c4816c","name":"Deep Red"},
    {"i":24,"hex":"#7c273f","name":"Dark Red"},{"i":25,"hex":"#a05938","name":"Dark Red"},
    {"i":26,"hex":"#89bca0","name":"Green"},{"i":27,"hex":"#277c7c","name":"Dark Teal"},
    {"i":28,"hex":"#309590","name":"Dark Teal"},{"i":29,"hex":"#27a0aa","name":"Deep Teal"},
    {"i":30,"hex":"#273f95","name":"Dark Blue"},{"i":31,"hex":"#a090b8","name":"Purple"},
    {"i":32,"hex":"#ad99b3","name":"Purple"},{"i":33,"hex":"#c43f81","name":"Deep Red"},
    {"i":34,"hex":"#aa1990","name":"Deep Magenta"},{"i":35,"hex":"#593f2c","name":"Dark Orange"},
    {"i":36,"hex":"#aa9e81","name":"Orange"},{"i":37,"hex":"#aa7c59","name":"Deep Orange"},
    {"i":38,"hex":"#957945","name":"Dark Orange"},{"i":39,"hex":"#a0bcc4","name":"Teal"}
  ];
  const TILE_PALETTE = [
    {"i":0,"hex":"#dddbd7","name":"Light Gray"},{"i":1,"hex":"#cecabf","name":"Orange"},
    {"i":2,"hex":"#adadaf","name":"Gray"},{"i":3,"hex":"#69696a","name":"Dark Gray"},
    {"i":4,"hex":"#b3a48b","name":"Orange"},{"i":5,"hex":"#59735d","name":"Dark Green"},
    {"i":6,"hex":"#303c55","name":"Dark Blue"},{"i":7,"hex":"#1d1d1f","name":"Black"}
  ];

  const viewer = document.getElementById("viewer");

  function findMaterials(name) {
    return viewer.model ? viewer.model.materials.filter(m => m.name === name) : [];
  }
  function setMaterialColorLinear(materialName, linearRgb) {
    findMaterials(materialName).forEach(m => {
      m.pbrMetallicRoughness.setBaseColorFactor([linearRgb[0], linearRgb[1], linearRgb[2], 1]);
    });
  }
  function setRoughness(materialName, roughness) {
    findMaterials(materialName).forEach(m => m.pbrMetallicRoughness.setRoughnessFactor(roughness));
  }
  function setMetallic(materialName, metallic) {
    findMaterials(materialName).forEach(m => m.pbrMetallicRoughness.setMetallicFactor(metallic));
  }

  function updateFilament(index) {
    const p = FILAMENT_PALETTE[index];
    document.getElementById("filamentSwatch").style.background = p.hex;
    document.getElementById("filamentLabel").textContent = p.name;
    setMaterialColorLinear("Printed plastic", hexToLinear(p.hex));
  }
  function updateTile(index) {
    const p = TILE_PALETTE[index];
    document.getElementById("tileSwatch").style.background = p.hex;
    document.getElementById("tileLabel").textContent = p.name;
    // tints the baked tile/grout texture rather than replacing it, so the
    // physical tile pattern stays visible under whatever color is picked
    setMaterialColorLinear("Square Wall Tiles", hexToLinear(p.hex));
    document.querySelectorAll(".tile-btn").forEach((btn, i) => btn.classList.toggle("selected", i === index));
  }
  function updatePowder(hex) {
    const linear = hexToLinear(hex);
    const coated = applyPowderCoating(linear);
    document.getElementById("powderSwatch").style.background = linearToHex(coated);
    document.getElementById("powderLabel").textContent = linearToHex(coated);
    setMaterialColorLinear("Black Powder Coating Texture", coated);
  }
  function updateMetallic(isMetallic) {
    setMetallic("Black Powder Coating Texture", isMetallic ? 1.0 : 0.0);
  }

  // build tile swatch buttons
  const tileRow = document.getElementById("tileRow");
  TILE_PALETTE.forEach((p, i) => {
    const btn = document.createElement("button");
    btn.className = "tile-btn";
    btn.style.background = p.hex;
    btn.title = p.name;
    btn.addEventListener("click", () => updateTile(i));
    tileRow.appendChild(btn);
  });

  document.getElementById("filamentSlider").addEventListener("input", e => updateFilament(parseInt(e.target.value, 10)));
  document.getElementById("powderPicker").addEventListener("input", e => updatePowder(e.target.value));
  document.getElementById("metallicToggle").addEventListener("change", e => updateMetallic(e.target.checked));

  viewer.addEventListener("load", () => {
    setRoughness("Printed plastic", 0.4);
    setMetallic("Printed plastic", 0.0);
    setRoughness("Black Powder Coating Texture", 0.45);
    updateFilament(21);
    updateTile(1);
    updatePowder("#046ffc");
    updateMetallic(document.getElementById("metallicToggle").checked);
  });
</script>
